<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes ani-animation {
        0% {
          --c-0: hsla(156, 100%, 50%, 1);
          --x-0: 80%;
          --y-0: 50%;
          --s-start-0: 0%;
          --s-end-0: 50%;
          --c-1: hsla(143, 63%, 63%, 1);
          --x-1: 0%;
          --y-1: 100%;
          --s-start-1: 0%;
          --s-end-1: 50%;
          --c-2: hsla(225, 51%, 51%, 1);
          --x-2: 80%;
          --y-2: 100%;
          --s-start-2: 0%;
          --s-end-2: 50%;
          --c-3: hsla(216, 86%, 52%, 1);
          --x-3: 0%;
          --y-3: 0%;
          --s-start-3: 0%;
          --s-end-3: 50%;
        }

        100% {
          --c-0: hsla(156, 100%, 50%, 1);
          --x-0: 78%;
          --y-0: 33%;
          --s-start-0: 4%;
          --s-end-0: 79%;
          --c-1: hsla(143, 63%, 63%, 1);
          --x-1: 64%;
          --y-1: 99%;
          --s-start-1: 4%;
          --s-end-1: 79%;
          --c-2: hsla(225, 51%, 51%, 1);
          --x-2: 54%;
          --y-2: 99%;
          --s-start-2: 4%;
          --s-end-2: 79%;
          --c-3: hsla(216, 86%, 52%, 1);
          --x-3: 81%;
          --y-3: 45%;
          --s-start-3: 4%;
          --s-end-3: 79%;
        }
      }

      @property --c-0 {
        syntax: '<color>';
        inherits: false;
        initial-value: hsla(156, 100%, 50%, 1);
      }

      @property --x-0 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 80%;
      }

      @property --y-0 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 50%;
      }

      @property --s-start-0 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --s-end-0 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 50%;
      }

      @property --c-1 {
        syntax: '<color>';
        inherits: false;
        initial-value: hsla(143, 63%, 63%, 1);
      }

      @property --x-1 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --y-1 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 100%;
      }

      @property --s-start-1 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --s-end-1 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 50%;
      }

      @property --c-2 {
        syntax: '<color>';
        inherits: false;
        initial-value: hsla(225, 51%, 51%, 1);
      }

      @property --x-2 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 80%;
      }

      @property --y-2 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 100%;
      }

      @property --s-start-2 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --s-end-2 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 50%;
      }

      @property --c-3 {
        syntax: '<color>';
        inherits: false;
        initial-value: hsla(216, 86%, 52%, 1);
      }

      @property --x-3 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --y-3 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --s-start-3 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      @property --s-end-3 {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 50%;
      }

      #animation {
        --c-0: hsla(156, 100%, 50%, 1);
        --x-0: 80%;
        --y-0: 50%;
        --c-1: hsla(143, 63%, 63%, 1);
        --x-1: 0%;
        --y-1: 100%;
        --c-2: hsla(225, 51%, 51%, 1);
        --x-2: 80%;
        --y-2: 100%;
        --c-3: hsla(216, 86%, 52%, 1);
        --x-3: 0%;
        --y-3: 0%;
        background-color: hsla(212, 72%, 58%, 1);
        background-image:
          radial-gradient(
            circle at var(--x-0) var(--y-0),
            var(--c-0) var(--s-start-0),
            transparent var(--s-end-0)
          ),
          radial-gradient(
            circle at var(--x-1) var(--y-1),
            var(--c-1) var(--s-start-1),
            transparent var(--s-end-1)
          ),
          radial-gradient(
            circle at var(--x-2) var(--y-2),
            var(--c-2) var(--s-start-2),
            transparent var(--s-end-2)
          ),
          radial-gradient(
            circle at var(--x-3) var(--y-3),
            var(--c-3) var(--s-start-3),
            transparent var(--s-end-3)
          );
        animation: ani-animation 2s linear infinite alternate-reverse;
        background-blend-mode: normal, normal, normal, normal;
        will-change: transform, opacity;
        contain: paint;
      }

      #animation {
        width: 1170px;
        height: 2532px;
      }

      #logo,
      #shadow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 80%;
        transform: translate(-50%, -50%);
      }

      #logo {
        mix-blend-mode: overlay;
      }

      #shadow {
        opacity: 0.5;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="animation">
      <img id="logo" src="./icons/name.svg" />
      <img id="shadow" src="./icons/name.svg" />
      <script>
        setTimeout(() => {
          const stream = document.body.captureStream(60);
          const recorder = new MediaRecorder(stream);

          let chunks = [];
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            window.open(url);
          };

          recorder.start();

          // parar depois de X segundos:
          setTimeout(() => recorder.stop(), 2e3);
        }, 1e3);
      </script>
    </div>
  </body>
</html>
