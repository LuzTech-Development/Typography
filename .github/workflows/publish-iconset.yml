name: Publish Icon Set

on:
    push:
        branches: [master]
        paths: ['assets/**', 'scripts/**', 'icons/**', 'Makefile']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install packages
              run: |
                sudo apt-get install --yes \
                    inkscape \
                    imagemagick \
                    build-essential \
                    fonts-space-grotesk

            - name: Verify font installation
              run: |
                fc-list | grep "Space Grotesk" || exit 1

            - name: Build assets
              run: make
            - name: Upload artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: icon-set
                  path: out/
    publish_release:
        name: "Publish ARM Template on GitHub Releases"
        needs: build
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: icon-set
                  path: ./icon-set
                  merge-multiple: true
            - name: Create Tag Name
              id: tag_name
              run: echo "tag_name=$(date +'v%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
            - name: Create Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ env.tag_name }}
                  release_name: Release ${{ env.tag_name }}
                  body: Release of ARM Template on ${{ github.event.repository.updated_at }}
                  draft: false
                  prerelease: false
            - name: Prepare release assets
              run: |
                  mkdir -p ./upload/icons
                  mv ./icon-set/ICONSHEET.pdf ./upload/ICONSHEET.pdf
                  cd ./icon-set
                  zip -r ../upload/icons.zip ./*
            - name: Upload ICONSHEET PDF
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./upload/ICONSHEET.pdf
                  asset_name: ICONSHEET.pdf
                  asset_content_type: application/pdf
            - name: Upload Icons
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./upload/icons.zip
                  asset_name: icons.zip
                  asset_content_type: application/zip
    publish-onedrive:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v6
              with:
                  name: icon-set
                  path: icon-set/
            - name: Publish to OneDrive
              run: echo "TODO!"
    publish-cdn:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v6
              with:
                  name: icon-set
            - name: Publish to CDN
              run: echo "TODO!"
