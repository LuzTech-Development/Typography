name: Publish to OneDrive

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install Space Grotesk font
              run: |
                mkdir -p ~/.local/share/fonts/space-grotesk
                cd ~/.local/share/fonts/space-grotesk

                curl -s -O https://fonts.gstatic.com/s/spacegrotesk/v12/pxiDyp8kv8JHgFVrJJfedwE3V1wA5cw.woff2
                curl -s -O https://fonts.gstatic.com/s/spacegrotesk/v12/pxiFyp8kv8JHgFVrLCz7Z1xlEA.woff2
                curl -s -O https://fonts.gstatic.com/s/spacegrotesk/v12/pxiGyp8kv8JHgFVrDWZxkBxHPyw.woff2
                cd ~

                fc-cache -f -v

            - name: Verify font installation
              run: |
                fc-list | grep "Space Grotesk" || exit 1

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '24'

            - name: Install IFMD
              run: npm install --global @giancarl021/ifmd
            - name: Install packages
              run: |
                sudo add-apt-repository ppa:inkscape.dev/stable
                sudo apt-get update
                sudo apt-get install --yes inkscape imagemagick build-essential

            - name: Build assets
              run: make
            - name: Upload artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: icon-set
                  path: out/
    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v6
              with:
                  name: icon-set
                  path: icon-set/